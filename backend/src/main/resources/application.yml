server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.hbm2ddl.halt_on_error: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
assistant:
  token: ${ASSISTANT_API_TOKEN:}
  reminders:
    channel: ${REMINDER_CHANNEL:SYSTEM}
    worker-enabled: ${REMINDER_WORKER_ENABLED:true}
    catch-up-seconds: 300
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./.local/assistant;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/personal_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:assistant}
    password: ${DB_PASSWORD}
