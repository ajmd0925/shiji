name: Windows portable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test portable app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { "0.2.0-ci.$env:GITHUB_RUN_NUMBER" }
          ./scripts/package-windows.ps1 -Version $version -DownloadRuntime
          $archive = (Get-ChildItem release/shiji-*-windows-x64.zip).FullName
          ./scripts/test-portable.ps1 -Archive $archive -BrowserChecks
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: shiji-windows-x64
          path: |
            release/shiji-*-windows-x64.zip
            release/shiji-*-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release/shiji-*-windows-x64.zip* | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "拾记 $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
